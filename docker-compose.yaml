services:
  watch-docker:
    image: jianxcao/watch-docker:latest
    container_name: watch-docker
    hostname: watch-docker
    # 宿主机终端具有等同 root 的权限。仅在可信的 Linux 主机上启用以下两项：
    # pid: host
    # privileged: true
    # 自己无法更新自己，会死求的
    labels:
      - "watchdocker.skip=true"
    ports:
      - "8080:8080"
    volumes:
      - /volume1/watch-docker:/config
      # 放置 docker yaml文件的目录，必须左右 2 侧一样
      - /volume1/docker:/volume1/docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Asia/Shanghai
      - USER_NAME=admin
      - USER_PASSWORD=admin
      - PUID=0
      - PGID=0
      - UMASK=0000
      # 是否开启 shell 功能，危险操作
      - IS_OPEN_DOCKER_SHELL=false
      # local = Watch Docker 容器终端；host = Linux Docker 宿主机终端
      # host 模式还必须启用上面的 pid: host、privileged: true，并保持 PUID=0
      - TERMINAL_TARGET=local
        # 放置 docker yaml文件的目录，注意是所有docker 的目录，不是 watch-docker 的目录
      - APP_PATH=/volume1/docker
      # 是否开启二次验证
      - IS_SECONDARY_VERIFICATION=false
    restart: unless-stopped
